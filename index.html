<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Domino Points - Scorekeeper & Scanner</title>

  <!-- PWA -->
  <meta name="theme-color" content="#10b981" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Domino" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap');
    body {
      font-family: 'Outfit', sans-serif;
      touch-action: manipulation;
    }
    .ar-font {
      font-family: 'Noto Kufi Arabic', sans-serif;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(600px 420px at 8% -5%, rgba(16,185,129,.20), transparent 60%),
        radial-gradient(520px 420px at 100% 12%, rgba(59,130,246,.16), transparent 60%),
        radial-gradient(560px 520px at 50% 112%, rgba(20,184,166,.14), transparent 60%);
    }
    .glass {
      background: linear-gradient(160deg, rgba(30,41,59,.62), rgba(15,23,42,.82));
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .card-p1 { box-shadow: 0 0 0 1px rgba(16,185,129,.30), 0 14px 30px -14px rgba(16,185,129,.35); }
    .card-p2 { box-shadow: 0 0 0 1px rgba(59,130,246,.30), 0 14px 30px -14px rgba(59,130,246,.35); }
    .lead-1 { box-shadow: 0 0 0 2px rgba(16,185,129,.85), 0 0 32px rgba(16,185,129,.35); }
    .lead-2 { box-shadow: 0 0 0 2px rgba(59,130,246,.85), 0 0 32px rgba(59,130,246,.35); }
    .tabular { font-variant-numeric: tabular-nums; }
    .pop { animation: pop .4s cubic-bezier(.2,.9,.3,1.3); }
    .slide-up { animation: slideUp .3s cubic-bezier(.2,.8,.2,1); }
    .fade-in { animation: fadeIn .22s ease; }
    .float { animation: float 4s ease-in-out infinite; }
    .shine { position: relative; overflow: hidden; }
    .shine::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%);
      transform: translateX(-130%); animation: shine 3.6s ease-in-out infinite;
    }
    @keyframes pop { 0% { transform: scale(.75); opacity: .3 } 60% { transform: scale(1.12) } 100% { transform: scale(1); opacity: 1 } }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
    @keyframes shine { 0%,55% { transform: translateX(-130%) } 100% { transform: translateX(130%) } }
    .scanner-viewfinder {
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
    }
  </style>

  <!-- Capture the install prompt as early as possible (Chrome / Android) -->
  <script>
    window.__installPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__installPrompt = e;
      window.dispatchEvent(new Event('install-ready'));
    });
    window.addEventListener('appinstalled', function () {
      window.__installPrompt = null;
      window.dispatchEvent(new Event('install-done'));
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- MAIN APP COMPONENT ---
    function DominoApp() {
      // Game State
      const [targetScore, setTargetScore] = useState(() => {
        return parseInt(localStorage.getItem('domino_target') || '151', 10);
      });
      const [players, setPlayers] = useState(() => {
        const saved = localStorage.getItem('domino_players');
        return saved ? JSON.parse(saved) : [
          { id: 1, name: 'Player 1', score: 0 },
          { id: 2, name: 'Player 2', score: 0 }
        ];
      });
      const [rounds, setRounds] = useState(() => {
        const saved = localStorage.getItem('domino_rounds');
        return saved ? JSON.parse(saved) : [];
      });

      const [sets, setSets] = useState(() => {
        const saved = localStorage.getItem('domino_sets');
        return saved ? JSON.parse(saved) : { 1: 0, 2: 0 };
      });
      const [overWinner, setOverWinner] = useState(() => {
        const v = localStorage.getItem('domino_over');
        return v ? parseInt(v, 10) : null;
      });

      // UI States
      const [modal, setModal] = useState(null); // 'manual' | 'camera' | 'settings' | 'winner' | 'install-help'
      const [selectedPlayerId, setSelectedPlayerId] = useState(1);
      const [winner, setWinner] = useState(null);

      // Install state
      const [canInstall, setCanInstall] = useState(!!window.__installPrompt);
      const [isInstalled, setIsInstalled] = useState(false);
      const [isIOS, setIsIOS] = useState(false);

      useEffect(() => {
        const ua = window.navigator.userAgent.toLowerCase();
        setIsIOS(/iphone|ipad|ipod/.test(ua) || (ua.includes('macintosh') && navigator.maxTouchPoints > 1));

        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
          setIsInstalled(true);
        }

        const onReady = () => setCanInstall(true);
        const onDone = () => { setIsInstalled(true); setCanInstall(false); };
        window.addEventListener('install-ready', onReady);
        window.addEventListener('install-done', onDone);
        return () => {
          window.removeEventListener('install-ready', onReady);
          window.removeEventListener('install-done', onDone);
        };
      }, []);

      const handleInstallClick = async () => {
        const prompt = window.__installPrompt;
        if (prompt) {
          prompt.prompt();
          const { outcome } = await prompt.userChoice;
          if (outcome === 'accepted') setIsInstalled(true);
          window.__installPrompt = null;
          setCanInstall(false);
        } else {
          setModal('install-help'); // iOS / browsers without the native prompt
        }
      };

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem('domino_target', targetScore);
        localStorage.setItem('domino_players', JSON.stringify(players));
        localStorage.setItem('domino_rounds', JSON.stringify(rounds));
      }, [players, targetScore, rounds]);

      useEffect(() => {
        localStorage.setItem('domino_sets', JSON.stringify(sets));
        localStorage.setItem('domino_over', overWinner === null ? '' : String(overWinner));
      }, [sets, overWinner]);

      // Check victory (a set is counted once per win)
      useEffect(() => {
        const someoneWon = targetScore > 0 && (players[0].score >= targetScore || players[1].score >= targetScore);
        if (someoneWon) {
          if (overWinner === null) {
            const champ = players[0].score > players[1].score ? players[0] : players[1];
            setOverWinner(champ.id);
            setSets(prev => ({ ...prev, [champ.id]: (prev[champ.id] || 0) + 1 }));
            setWinner(champ);
            setModal('winner');
            try {
              confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
            } catch (e) {}
          }
        } else if (overWinner !== null) {
          // Win was undone (undo or higher goal): take the set back
          setSets(prev => ({ ...prev, [overWinner]: Math.max(0, (prev[overWinner] || 0) - 1) }));
          setOverWinner(null);
        }
      }, [players, targetScore, overWinner]);

      // Add points
      const addPoints = (playerId, points, method = 'keyboard') => {
        if (!points || isNaN(points) || points <= 0) return;

        const newPlayers = players.map(p => {
          if (p.id === playerId) {
            return { ...p, score: p.score + points };
          }
          return p;
        });

        const newRound = {
          id: Date.now(),
          playerId,
          points,
          method,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setPlayers(newPlayers);
        setRounds([newRound, ...rounds]);
        setModal(null);
      };

      // Undo round
      const undoRound = (roundId) => {
        const roundToUndo = rounds.find(r => r.id === roundId);
        if (!roundToUndo) return;

        setPlayers(players.map(p => {
          if (p.id === roundToUndo.playerId) {
            return { ...p, score: Math.max(0, p.score - roundToUndo.points) };
          }
          return p;
        }));

        setRounds(rounds.filter(r => r.id !== roundId));
      };

      // Start a new match (sets are kept)
      const newMatch = () => {
        setPlayers([
          { id: 1, name: players[0].name, score: 0 },
          { id: 2, name: players[1].name, score: 0 }
        ]);
        setRounds([]);
        setWinner(null);
        setOverWinner(null);
        setModal(null);
      };

      const resetGame = () => {
        if (confirm("Reset the current match? Scores and history will be cleared (sets are kept).")) {
          newMatch();
        }
      };

      const clearSets = () => {
        if (confirm("Clear the sets counter?")) {
          setSets({ 1: 0, 2: 0 });
        }
      };

      const leaderId = players[0].score === players[1].score ? null : (players[0].score > players[1].score ? 1 : 2);

      return (
        <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4 pb-8">
          {/* Header */}
          <header class="flex items-center justify-between py-3 border-b border-slate-800">
            <div class="flex items-center space-x-2">
              <img src="icon-192.png" alt="" class="w-9 h-9 rounded-xl shadow-lg shadow-emerald-500/30 float" />
              <span class="font-black text-lg tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white to-emerald-300">DOMINO</span>
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Points</span>
            </div>

            <div class="flex items-center gap-2">
              {/* Small install button */}
              {!isInstalled && (
                <button
                  onClick={handleInstallClick}
                  class="w-8 h-8 flex items-center justify-center bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-full active:scale-95 transition"
                  title="Install app"
                  aria-label="Install app"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                </button>
              )}

              {/* Target Score Edit Button */}
              <button
                onClick={() => setModal('settings')}
                class="flex items-center gap-1.5 bg-slate-900 border border-slate-800 hover:border-slate-700 px-3 py-1.5 rounded-full text-xs font-medium text-slate-300"
              >
                <span>Goal: <strong class="text-emerald-400 font-bold">{targetScore}</strong></span>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </button>
            </div>
          </header>

          {/* Players Score Cards */}
          <div class="grid grid-cols-2 gap-3 my-4">
            {players.map((player, idx) => {
              const progress = Math.min(100, Math.round((player.score / targetScore) * 100));
              const isP1 = idx === 0;
              return (
                <div
                  key={player.id}
                  onClick={() => { setSelectedPlayerId(player.id); setModal('manual'); }}
                  class={`glass relative cursor-pointer active:scale-[0.97] rounded-3xl p-4 flex flex-col justify-between transition-all duration-500 ${isP1 ? 'card-p1' : 'card-p2'} ${leaderId === player.id ? (isP1 ? 'lead-1' : 'lead-2') : ''}`}
                >
                  <div class="flex items-center justify-between mb-2">
                    <input
                      type="text"
                      value={player.name}
                      onClick={(e) => e.stopPropagation()}
                      onChange={(e) => {
                        const val = e.target.value;
                        setPlayers(players.map(p => p.id === player.id ? { ...p, name: val } : p));
                      }}
                      class="bg-transparent font-bold text-sm tracking-wide focus:outline-none focus:ring-1 focus:ring-slate-400 rounded px-1 -ml-1 text-slate-200 truncate w-24"
                    />
                    <span class={`text-[10px] font-bold px-1.5 py-0.5 rounded ${isP1 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-blue-500/20 text-blue-400'}`}>
                      {leaderId === player.id ? '👑 Lead' : `P${player.id}`}
                    </span>
                  </div>

                  <div class="my-2">
                    <div key={player.score} class="pop tabular text-6xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-b from-white to-slate-400">{player.score}</div>
                    <div class="text-xs text-slate-500 font-medium mt-0.5">
                      {targetScore - player.score > 0 ? `${targetScore - player.score} to win` : 'WINNER!'}
                    </div>
                  </div>

                  <div class="w-full bg-slate-800/80 h-2.5 rounded-full overflow-hidden mt-2">
                    <div
                      class={`h-full rounded-full transition-all duration-700 ${isP1 ? 'bg-gradient-to-r from-emerald-500 to-teal-300 shadow-[0_0_10px_rgba(16,185,129,.7)]' : 'bg-gradient-to-r from-blue-500 to-sky-300 shadow-[0_0_10px_rgba(59,130,246,.7)]'}`}
                      style={{ width: `${progress}%` }}
                    />
                  </div>

                  {/* Sets won */}
                  <div class="flex items-center justify-between mt-3 pt-2.5 border-t border-slate-700/50">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">🏆 Sets</span>
                    <span key={sets[player.id] || 0} class={`pop tabular text-xl font-black ${isP1 ? 'text-emerald-400' : 'text-blue-400'}`}>{sets[player.id] || 0}</span>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Hint + clear sets */}
          <div class="flex items-center justify-between mb-3 px-1 text-xs">
            <span class="text-slate-500 font-medium">Tap a player card to add points</span>
            <button
              onClick={clearSets}
              class="font-semibold text-rose-400 hover:text-rose-300 bg-slate-900/70 border border-slate-800 px-3 py-1 rounded-full active:scale-95 transition"
            >
              Clear sets
            </button>
          </div>

          {/* Camera scanner */}
          <button
            onClick={() => { setSelectedPlayerId(1); setModal('camera'); }}
            class="shine w-full flex items-center justify-center gap-2 mb-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-95 py-4 px-4 rounded-2xl font-bold text-white shadow-lg shadow-emerald-500/30 transition"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span>Scan Dominoes</span>
          </button>

          {/* History Feed */}
          <div class="flex-1 glass border border-slate-800 rounded-3xl p-3 overflow-hidden flex flex-col mb-4">
            <div class="flex justify-between items-center px-1 pb-2 border-b border-slate-800 text-xs font-semibold text-slate-400">
              <span>ROUND LOG</span>
              <button onClick={resetGame} class="text-rose-400 hover:text-rose-300">Clear Game</button>
            </div>
            <div class="overflow-y-auto flex-1 divide-y divide-slate-800/60 mt-1 max-h-48 pr-1">
              {rounds.length === 0 ? (
                <div class="text-center py-6 text-slate-600 text-sm">No points recorded yet.<br/>Tap a player card or scan domino tiles!</div>
              ) : (
                rounds.map(r => {
                  const p = players.find(player => player.id === r.playerId) || { name: 'Player' };
                  return (
                    <div key={r.id} class={`fade-in flex items-center justify-between py-2 pl-2 text-sm border-l-2 ${r.playerId === 1 ? 'border-emerald-500' : 'border-blue-500'}`}>
                      <div class="flex items-center gap-2">
                        <span class="text-xs text-slate-500">{r.time}</span>
                        <span class={`font-semibold ${r.playerId === 1 ? 'text-emerald-400' : 'text-blue-400'}`}>
                          {p.name}
                        </span>
                        <span class="text-xs bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded">
                          {r.method === 'camera' ? '📷 scan' : '⌨️ manual'}
                        </span>
                      </div>
                      <div class="flex items-center gap-3">
                        <span class="font-extrabold text-white text-base">+{r.points}</span>
                        <button
                          onClick={() => undoRound(r.id)}
                          title="Undo score"
                          class="text-slate-500 hover:text-rose-400 transition"
                        >
                          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>

          {/* SPONSOR SECTION */}
          <div class="glass border border-slate-800/80 rounded-3xl p-3.5 shadow-lg">
            <div clas
